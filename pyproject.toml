[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accessibility-test-automation-framework"
version = "0.1.0"
description = "A small shop and the checks that test its pages against WCAG 2.1 AA success criteria"
authors = [{ name = "Pavel Zhukov Atum" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-playwright>=0.6",
    "allure-pytest>=2.13",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools]
# `vendor/` is shipped next to `a11y/`, where `a11y/axe.py` looks for it in a checkout and once installed alike.
packages = ["app", "a11y", "vendor"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "static/*.js", "static/img/*.svg"]
vendor = ["axe.min.js", "axe-core-LICENSE.txt", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "a11y"]
